spring.application.name=smart-elderly-backend
server.port=${SERVER_PORT:8080}

# Load a project-root .env when running from backend/ and a local .env otherwise.
# This keeps credentials outside source code and works with standard KEY=value lines.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# ---- MongoDB (Atlas or local) ----
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/smart_elderly_portal}
spring.data.mongodb.database=${MONGODB_DATABASE:smart_elderly_portal}

# ---- Mail (Gmail SMTP with an app password) ----
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000

# ---- Uploads ----
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_MB:200}MB
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_MB:200}MB
spring.servlet.multipart.file-size-threshold=2MB

# ---- Application ----
app.storage-dir=${STORAGE_DIR:storage}
app.timezone=${APP_TIMEZONE:Asia/Kolkata}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

app.security.jwt-secret=${JWT_SECRET:}
app.security.jwt-expiration-hours=${JWT_EXPIRATION_HOURS:12}
app.security.allow-registration=${ALLOW_REGISTRATION:true}
app.security.bootstrap-admin-email=${ADMIN_EMAIL:}
app.security.bootstrap-admin-password=${ADMIN_PASSWORD:}
app.security.bootstrap-admin-name=${ADMIN_NAME:Administrator}

app.ml.url=${ML_SERVICE_URL:http://localhost:8000}
app.ml.service-key=${ML_SERVICE_API_KEY:}
app.ml.timeout-seconds=${ML_TIMEOUT_SECONDS:120}

app.groq.key=${GROQ_API_KEY:}
app.groq.model=${GROQ_MODEL:qwen/qwen3.8-27b}
app.groq.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
app.groq.timeout-seconds=${GROQ_TIMEOUT_SECONDS:20}

app.mail.from=${MAIL_FROM:}
app.mail.emergency-email=${EMERGENCY_EMAIL:}

app.detection.default-confidence-threshold=${FALL_CONFIDENCE_THRESHOLD:0.70}
app.detection.default-verification-seconds=${FALL_VERIFICATION_SECONDS:5}

logging.level.org.mongodb.driver.cluster=WARN
